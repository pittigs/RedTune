services:
  redtune:
    image: ghcr.io/pittigs/redtune:latest
    # Optional: Zum lokalen Bauen einkommentieren:
    # build: .
    container_name: redtune
    restart: unless-stopped
    ports:
      # Web-Dashboard & Echtzeit-Steuerung im Browser
      - "58913:58913"
    volumes:
      # Speichert config.json und die generierte TeamSpeak-Identität persistent
      - ./data:/app/data
