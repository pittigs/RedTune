services:
  redtune:
    image: ghcr.io/pittigs/redtune:latest
    container_name: redtune
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      # --- TeamSpeak Verbindungsdaten ---
      - TEAMSPEAK_ADDR=ts.deinedomain.de:9987   # IP oder Domain des TeamSpeak Servers
      - TEAMSPEAK_PASSWORD=                    # Serverpasswort (falls vorhanden)
      - TEAMSPEAK_NICKNAME=RedTune             # Name des Bots im TeamSpeak
      - TEAMSPEAK_CHANNEL=                     # Channel (z. B. "Musik" oder leer lassen)
      - TEAMSPEAK_CHANNEL_PASSWORD=            # Channelpasswort (falls geschützt)
      # --- Web Dashboard Schutz ---
      - WEB_PASSWORD=                          # Optional: Passwort für Web-Interface (z.B. MeinPasswort123)
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_proxy"
      traefik.http.routers.redtune.rule: "Host(`redtune.pittigs.eu`)"
      traefik.http.routers.redtune.entrypoints: "websecure"
      traefik.http.routers.redtune.tls: "true"
      traefik.http.routers.redtune.tls.certresolver: "http-resolver"
      traefik.http.services.redtune.loadbalancer.server.port: "58913"
      traefik.http.services.redtune.loadbalancer.server.scheme: "http"
    networks:
      - default
      - traefik_proxy
    volumes:
      - ./data:/app/data

networks:
  default:
  traefik_proxy:
    external: true
