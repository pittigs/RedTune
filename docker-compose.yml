services:
  redtune:
    image: ghcr.io/pittigs/redtune:latest
    container_name: redtune
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_proxy"
      traefik.http.routers.redtune.rule: "Host(`redtune.pittigs.eu`)"
      traefik.http.routers.redtune.entrypoints: "websecure"
      traefik.http.routers.redtune.tls: "true"
      traefik.http.routers.redtune.tls.certresolver: "http-resolver"
      traefik.http.services.redtune.loadbalancer.server.port: "58913"
      traefik.http.services.redtune.loadbalancer.server.scheme: "http"
    networks:
      - default
      - traefik_proxy
    volumes:
      - ./data:/app/data

networks:
  default:
  traefik_proxy:
    external: true
