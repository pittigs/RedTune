<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedTune – TS6 Music Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Red<span>Tune</span></h1>
          <p id="botStatusText">Verbinde...</p>
        </div>
      </div>
      <div class="header-badges">
        <div class="status-badge" id="connectionBadge">
          <span class="status-dot"></span>
          <span id="connectionText">Getrennt</span>
        </div>
        <div class="server-badge" id="serverBadge">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M4 1h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/>
          </svg>
          <span id="serverText">Server</span>
        </div>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <form id="searchForm" class="search-bar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="YouTube Music Link, Playlist oder Songtitel eingeben..." 
          autocomplete="off"
        />
        <button type="submit" id="searchButton" class="btn-primary">
          <span>Abspielen</span>
        </button>
      </form>
    </section>

    <!-- Main Content Grid -->
    <main class="dashboard-grid">
      <!-- Player Card -->
      <section class="card player-card">
        <div class="album-art-wrapper">
          <div class="album-art" id="albumArt">
            <div class="album-art-placeholder" id="albumArtPlaceholder">
              <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
              </svg>
            </div>
            <img id="trackThumbnail" src="" alt="Album Art" class="hidden" />
          </div>
        </div>

        <div class="track-details">
          <h2 id="trackTitle">Keine Wiedergabe</h2>
          <p id="trackMeta">Füge Musik über die Suche oder TeamSpeak hinzu</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
          <div class="time-display">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-row">
          <button id="prevBtn" class="control-btn" title="Vorheriger Song">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <button id="playPauseBtn" class="control-btn btn-play" title="Play / Pause">
            <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" class="hidden">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button id="nextBtn" class="control-btn" title="Nächster Song">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <button id="stopBtn" class="control-btn btn-subtle" title="Stoppen">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 6h12v12H6z"/>
            </svg>
          </button>
        </div>

        <!-- Volume Slider -->
        <div class="volume-container">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="vol-icon">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="50" class="slider" />
          <span id="volumeValue">50%</span>
        </div>
      </section>

      <!-- Queue Card -->
      <section class="card queue-card">
        <div class="card-header">
          <div class="card-title">
            <h3>Warteschlange</h3>
            <span class="queue-count" id="queueCount">0 Titel</span>
          </div>
          <div class="queue-actions">
            <button id="shuffleBtn" class="btn-icon" title="Mischen">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
              </svg>
            </button>
            <button id="clearQueueBtn" class="btn-icon" title="Warteschlange leeren">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="queue-list" id="queueList">
          <div class="empty-state">
            <p>Die Warteschlange ist leer.</p>
            <span>Verwende die Suche oben oder nutze <code>!play</code> im TeamSpeak-Chat.</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
